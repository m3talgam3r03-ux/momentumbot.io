[project]
name = "momentum-master"
version = "0.1.0"
description = "MOMENTUM MASTER: classificazione ed esecuzione dei segnali WDT MOMENTUM su un conto master FPG (MT5)."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
# RUF001-003: caratteri Unicode "ambigui" sono voluti (emoji e testi in italiano).
ignore = ["RUF001", "RUF002", "RUF003"]
